  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Readex Pro', 'sans-serif'],
            cyber: ['Orbitron', 'sans-serif'],
          },
          colors: {
            starlight: {
              black: '#0a0814',
              card: '#131024',
              pink: '#ff69b4',
              cyan: '#00f0ff',
              star: '#ffd700',
              purple: '#8a2be2',

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #0a0814;
      background-image: radial-gradient(rgba(255, 105, 180, 0.08) 1px, transparent 0);
      background-size: 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: 'Readex Pro', 'Segoe UI', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo de estrellas fijo */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background-color: #0a0814;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      width: 100%;
      max-width: 1200px;
    }

    .fanart-card {
      position: relative;
      background: rgba(19, 16, 36, 0.85);
      border: 1px solid rgba(255, 105, 180, 0.2);
      border-radius: 25px;
      padding: 40px 25px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.2);
      backdrop-filter: blur(12px);
    }

    .fanart-card h3 {
      font-family: 'Orbitron', cursive;
      font-size: 32px;
      letter-spacing: 1px;
      margin-top: 0;
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.6);
    }

    .fanart-card p {
      color: #b0aec4;
      font-size: 14px;
      margin-bottom: 35px;
    }

    /* Animaciones de scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Galería estilo Pinterest */
    .pinterest-grid {
      column-count: 3;
      column-gap: 16px;
      width: 100%;
    }
    @media (max-width: 900px) {
      .pinterest-grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      .pinterest-grid { column-count: 1; }
    }

    .pinterest-item {
      break-inside: avoid;
      margin-bottom: 16px;
      background: #131024;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .pinterest-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 240, 255, 0.3);
    }

    .pinterest-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .pinterest-item:hover img {
      transform: scale(1.03);
    }

    .pinterest-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 8, 20, 0) 0%, rgba(10, 8, 20, 0.6) 100%);
      opacity: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      transition: opacity 0.3s ease;
    }

    .pinterest-item:hover .pinterest-overlay {
      opacity: 1;
    }

    .overlay-text {
      align-self: flex-start;
      background: rgba(255, 105, 180, 0.9);
      color: #0a0814;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease;
    }

    .pinterest-item:hover .overlay-text {
      transform: translateY(0);
    }

    /* Lightbox */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10, 8, 20, 0.92);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-content {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 20px;
      border: 2px solid #ff69b4;
      box-shadow: 0 0 40px rgba(255, 105, 180, 0.5);
      object-fit: contain;
    }

    /* Botón volver arriba */
    #btn-top {
      transition: all 0.3s ease;
    }
    #btn-top:hover {
      transform: translateY(-3px);
    }

    /* Soporte para prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .reveal, .pinterest-item, .pinterest-item img {
        animation: none !important;
        transition: none !important;
      }
      .reveal {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- CANVAS DE ESTRELLAS -->

  <div class="wrapper max-w-6xl mx-auto">
    
    <!-- BOTÓN VOLVER -->
    <div class="reveal w-full flex justify-center">
      <a href="index.html" class="inline-flex items-center gap-2.5 px-6 py-2.5 rounded-full bg-starlight-card/80 border-2 border-pink-900/50 text-slate-200 font-cyber text-xs font-extrabold uppercase tracking-wider hover:bg-starlight-pink hover:text-black hover:border-starlight-pink transition-all duration-300 shadow-lg hover:shadow-pink-500/30 hover:-translate-y-0.5">
        <i class="fa-solid fa-arrow-left text-sm"></i> Volver a la página principal
      </a>
    </div>

    <!-- TARJETA PRINCIPAL -->
    <div class="fanart-card reveal">
      <h3 class="font-cyber">GALERÍA DE FAN ART 🎨</h3>
      <p>¡Todo el amor y arte que la comunidad ha creado para Togi! (Haz clic en cualquier dibujo para verlo en grande)</p>

      <!-- GALERÍA ESTILO PINTEREST -->
      <div class="pinterest-grid">

          <div class="pinterest-overlay">

        <div class="pinterest-item" onclick="openLightbox('img/31_sin_titulo.png')">
          <img src="img/31_sin_titulo.png" alt="Fan Art Togi" loading="lazy" decoding="async">
          <div class="pinterest-overlay">
            <span class="overlay-text"><i class="fa-solid fa-eye"></i> Ver</span>
          </div>
        </div>

        <div class="pinterest-item" onclick="openLightbox('img/image.png')">
          <img src="img/image.png" alt="Fan Art Togi" loading="lazy" decoding="async">
          <div class="pinterest-overlay">
            <span class="overlay-text"><i class="fa-solid fa-eye"></i> Ver</span>
          </div>

        <div class="pinterest-item" onclick="openLightbox('img/Screenshot_20250325_211815_TikTok.jpg')">
          <img src="img/Screenshot_20250325_211815_TikTok.jpg" alt="Fan Art Togi" loading="lazy" decoding="async">
          <div class="pinterest-overlay">
            <span class="overlay-text"><i class="fa-solid fa-eye"></i> Ver</span>

        <div class="pinterest-item" onclick="openLightbox('img/SPOILER_COMISION_INICIAL_TOGI_Y_AMIGA.jpg')">
          <img src="img/SPOILER_COMISION_INICIAL_TOGI_Y_AMIGA.jpg" alt="Fan Art Togi" loading="lazy" decoding="async">
          <div class="pinterest-overlay">
            <span class="overlay-text"><i class="fa-solid fa-eye"></i> Ver</span>
          </div>
        </div>

        <div class="pinterest-item" onclick="openLightbox('img/TOGI.jpg')">
          <img src="img/TOGI.jpg" alt="Fan Art Togi" loading="lazy" decoding="async">
          <div class="pinterest-overlay">

          <img src="img/togi_.png" alt="Fan Art Togi" loading="lazy" decoding="async">

  <!-- VISOR DE IMAGEN GRANDE -->
  <div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">

  <!-- SCRIPT FONDO DE ESTRELLAS -->
  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const numStars = 180;
    let isPageVisible = true;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.4 + 0.1,
        color: ['#ffffff', '#ff69b4', '#00f0ff', '#ffd700'][Math.floor(Math.random() * 4)],
        alpha: Math.random()
      });
    }

    document.addEventListener('visibilitychange', () => {
      isPageVisible = !document.hidden;
    });

    function animateStars() {
      if (isPageVisible) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => {
          ctx.fillStyle = star.color;
          ctx.globalAlpha = star.alpha;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
          star.y += star.speed;
          if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
          }
        });
      }
      requestAnimationFrame(animateStars);
    }
    animateStars();
  </script>

  <!-- SCRIPT LIGHTBOX -->
  <script>
    function openLightbox(imageSrc) {
      const modal = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = imageSrc;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox');
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // Cerrar con Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

  <!-- SCRIPT ANIMACIONES DE SCROLL -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>

  <!-- SCRIPT BOTÓN VOLVER ARRIBA -->
  <script>
    const btnTop = document.getElementById('btn-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        btnTop.classList.remove('hidden');
        btnTop.classList.add('flex');
      } else {
        btnTop.classList.add('hidden');
        btnTop.classList.remove('flex');
      }
    });
    btnTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>

</body>
