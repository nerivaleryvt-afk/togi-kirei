<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtítulos - Togi Kirei</title>

  <!-- Cargamos socket.io desde el servidor de ellos (evita CORS) -->
  <script src="https://streamtranslate.live/socket.io/socket.io.js"></script>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       🎯  AJUSTE ESTRICTO A 652px ANCHO Y 169px ALTO
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    body.pos-top    { align-items: flex-start; padding-top: 0; }
    body.pos-middle { align-items: center; }
    body.pos-bottom { align-items: flex-end; padding-bottom: 0; }

    /* ============================================================
       📦  CONTENEDOR CON ALTURA FIJA Y CENTRADO VERTICAL
       ============================================================ */
    .subtitle-container {
      width: 652px;
      height: 169px;             /* 👈 Altura fija, no máxima */
      
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;   /* 👈 Centrado vertical */
      gap: 0;
      
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 12px;         /* Padding lateral, sin vertical */
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      overflow: hidden;          /* Nunca se desborda */
    }
    .subtitle-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ============================================================
       📝  SOLO TEXTO TRADUCIDO (original oculto)
       ============================================================ */
    .subtitle-original {
      display: none !important;
    }

    .subtitle-translated {
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 
        0 0 12px rgba(0,0,0,0.95),
        1px 1px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
      padding: 0 4px;
      
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      max-width: 100%;
    }

    #subtitleTranslated2 {
      font-weight: 500;
      line-height: 1.2;
      color: #a5b4fc;
      text-shadow: 0 1px 8px rgba(0,0,0,0.9);
      padding: 0 4px;
      margin-top: 2px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 2px;
      
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      max-width: 100%;
    }

    .rtl { direction: rtl; unicode-bidi: embed; }

    /* Punto de conexión (solo visible con ?debug=1) */
    .conn-dot { display: none; }
    .conn-dot.debug-visible { display: block; position: fixed; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; transition: background 400ms; z-index: 999; }
    .conn-dot.connected { background: #22c55e; }

    #watermark {
      position: fixed; bottom: 4px; right: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 500;
      color: rgba(255,255,255,0.3);
      pointer-events: none; z-index: 999;
      display: none;
      background: rgba(0,0,0,0.2);
      padding: 2px 8px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="pos-bottom">

  <div class="conn-dot" id="connDot"></div>
  <div id="watermark">streamtranslate.live</div>

  <div class="subtitle-container" id="subtitleContainer">
    <div class="subtitle-original" id="subtitleOriginal"></div>
    <div class="subtitle-translated" id="subtitleTranslated"></div>
    <div class="subtitle-translated" id="subtitleTranslated2" style="display:none;"></div>
  </div>

  <script>
    // ================================================================
    // 📌  TUS PARÁMETROS REALES
    // ================================================================
    const roomId = 'd5306a7b-mtm3b6qu';
    const overlayTok = '86c3dc27aa89ac202d0a6db6de881d34363f7f641c34eb8a348831083174c163';
    const position = 'bottom';
    const transColor = '00ffcc';
    const trans2Color = 'a5b4fc';

    // ================================================================
    // 📐  MEDIDAS FIJAS DEL CONTENEDOR
    // ================================================================
    const CONTAINER_WIDTH = 652;
    const CONTAINER_HEIGHT = 169;
    const PADDING_LATERAL = 24; // 12+12 (padding lateral)
    const AVAILABLE_WIDTH = CONTAINER_WIDTH - PADDING_LATERAL;
    const LINE_HEIGHT = 1.2;

    // ================================================================
    // 🔧  FUNCIÓN DE AJUSTE DE TAMAÑO (centrado vertical)
    // ================================================================
    function adjustFontSize(text, element) {
      if (!text || text.length === 0) return;

      const CHAR_WIDTH_FACTOR = 0.55;
      let baseSize = 48;
      
      let newSize = baseSize;
      let lines = 1;
      let neededHeight = 0;
      
      for (let size = baseSize; size > 14; size -= 1) {
        const charsPerLine = AVAILABLE_WIDTH / (size * CHAR_WIDTH_FACTOR);
        lines = Math.ceil(text.length / charsPerLine);
        neededHeight = lines * size * LINE_HEIGHT;
        
        if (neededHeight <= CONTAINER_HEIGHT) {
          newSize = size;
          break;
        }
      }
      
      // Si aún no cabe, reducimos proporcionalmente
      if (neededHeight > CONTAINER_HEIGHT) {
        newSize = Math.max(16, newSize * (CONTAINER_HEIGHT / neededHeight));
      }
      
      newSize = Math.max(16, newSize);
      element.style.fontSize = newSize + 'px';
      return newSize;
    }

    // ================================================================
    // 🌐  CONEXIÓN AL SERVIDOR (SOLO WEBSOCKET)
    // ================================================================
    const socket = io('https://streamtranslate.live', {
      transports: ['websocket'],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
    });

    console.log('🔑 Conectando a sala:', roomId);

    document.body.className = `pos-${position}`;

    const origEl   = document.getElementById('subtitleOriginal');
    const transEl  = document.getElementById('subtitleTranslated');
    const trans2El = document.getElementById('subtitleTranslated2');
    const container = document.getElementById('subtitleContainer');
    const connDot = document.getElementById('connDot');

    if (new URLSearchParams(window.location.search).get('debug') === '1') {
      connDot.classList.add('debug-visible');
    }

    // Ocultar el original
    origEl.style.display = 'none';
    transEl.style.color = '#' + transColor;
    trans2El.style.color = '#' + trans2Color;

    socket.on('connect', () => {
      console.log('✅ Conectado vía WebSocket');
      connDot.classList.add('connected');
      socket.emit('join-room', roomId, { overlay: true, tok: overlayTok, preview: false });
      console.log(`📡 Unido a sala: ${roomId}`);
    });

    socket.on('connect_error', (err) => {
      console.error('❌ Error:', err.message);
    });

    socket.on('disconnect', () => {
      connDot.classList.remove('connected');
      container.classList.remove('visible');
    });

    // ================================================================
    // 📩  RECEPCIÓN Y MOSTRADO DE SUBTÍTULOS (SOLO TRADUCCIÓN)
    // ================================================================
    let clearTimer = null;
    let _lastTranslation = null;
    let _lastTranslation2 = null;

    const RTL_LANGS = ['ar', 'he', 'fa', 'ur'];
    const CJK_FONT = "'Noto Sans SC','Noto Sans JP','Noto Sans KR','PingFang SC','Microsoft YaHei','Hiragino Sans',sans-serif";
    const CJK_LANGS = ['zh', 'ja', 'ko'];
    const AR_FONT = "'Noto Sans Arabic','Arial',sans-serif";

    function applyLangFont(el, lang) {
      if (CJK_LANGS.includes(lang)) el.style.fontFamily = CJK_FONT;
      else if (lang === 'ar') el.style.fontFamily = AR_FONT;
      else el.style.fontFamily = "'Inter',system-ui,sans-serif";
    }

    function showSubtitle(data, interim = false) {
      console.log('📝 Traducción:', data.translated);

      // --- Traducción principal ---
      let transText;
      if (data.translated) {
        transText = data.translated;
        _lastTranslation = data.translated;
      } else if (_lastTranslation !== null) {
        transText = _lastTranslation;
      } else {
        transText = '';
      }
      transEl.textContent = transText + (interim ? '...' : '');
      transEl.style.color = '#' + transColor;
      transEl.classList.toggle('rtl', RTL_LANGS.includes(data.lang));
      applyLangFont(transEl, data.lang);
      transEl.style.opacity = interim ? '0.75' : '1';

      // 🔥  AJUSTE DE TAMAÑO
      adjustFontSize(transText, transEl);

      // --- Segunda traducción (si existe) ---
      let trans2Text;
      if (data.translated2) {
        trans2Text = data.translated2;
        _lastTranslation2 = data.translated2;
      } else if (_lastTranslation2 !== null) {
        trans2Text = _lastTranslation2;
      } else {
        trans2Text = '';
      }
      if (trans2Text) {
        trans2El.style.display = '';
        trans2El.textContent = trans2Text + (interim ? '...' : '');
        trans2El.classList.toggle('rtl', RTL_LANGS.includes(data.lang2));
        trans2El.style.opacity = interim ? '0.75' : '1';
        trans2El.style.color = '#' + trans2Color;
        applyLangFont(trans2El, data.lang2);
        // Segunda línea con tamaño más pequeño
        const base2 = Math.round(parseFloat(transEl.style.fontSize) * 0.7);
        trans2El.style.fontSize = Math.max(14, base2) + 'px';
      } else {
        trans2El.style.display = 'none';
      }

      // Mostrar contenedor
      container.classList.add('visible');
      clearTimeout(clearTimer);
      if (!interim) {
        clearTimer = setTimeout(() => container.classList.remove('visible'), 4000);
      }
    }

    socket.on('subtitle', (data) => {
      if (data && data.mismatched) return;
      showSubtitle(data, false);
    });
    socket.on('subtitle-interim', (data) => {
      if (data && data.mismatched) return;
      showSubtitle(data, true);
    });

    // Gestión de límites
    let overlayDisabled = false;
    socket.on('trial-expired', () => {
      console.warn('⛔ Prueba expirada');
      overlayDisabled = true;
      container.classList.remove('visible');
    });
    socket.on('hour-cap-reached', () => {
      console.warn('⏳ Límite de horas alcanzado');
      overlayDisabled = true;
      container.classList.remove('visible');
    });

    // Mantener conexión viva
    setInterval(() => {
      if (socket.connected) socket.emit('overlay-ping');
    }, 45000);

    console.log('🚀 Overlay listo (centrado, 652x169). Esperando voz...');
  </script>
</body>
</html>
