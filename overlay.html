<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtítulos Traducidos - Togi Kirei</title>

  <!-- ⚠️  IMPORTANTE: Cargamos socket.io desde el servidor de ellos (NO desde CDN) -->
  <script src="https://streamtranslate.live/socket.io/socket.io.js"></script>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       🎨 ESTILOS MODERNOS (Glassmorphism + Neón)
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    body.pos-top    { align-items: flex-start; padding-top: 48px; }
    body.pos-middle { align-items: center; }
    body.pos-bottom { align-items: flex-end; padding-bottom: 48px; }

    /* ============================================================
       🟢 CONTENEDOR PRINCIPAL (se ajusta al texto y lo envuelve)
       ============================================================ */
    .subtitle-container {
      max-width: 85%;            /* 👈 Más estrecho para forzar saltos de línea */
      width: auto;
      min-width: 280px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 16px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }
    .subtitle-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ============================================================
       📝 ESTILOS DEL TEXTO (con ajuste automático de tamaño)
       ============================================================ */
    .subtitle-original {
      font-weight: 400;
      font-size: 28px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      padding: 0 6px;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      padding-bottom: 4px;
      margin-bottom: 2px;
      
      /* Fuerza el salto de línea */
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      max-width: 100%;
    }

    .subtitle-translated {
      font-weight: 700;
      font-size: 54px;
      line-height: 1.2;          /* 👈 Más compacto */
      color: #ffffff;
      text-shadow: 
        0 0 20px rgba(0,0,0,0.95),
        2px 2px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000;
      padding: 0 6px;
      
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      max-width: 100%;
    }

    #subtitleTranslated2 {
      font-weight: 500;
      font-size: 32px;
      line-height: 1.2;
      color: #a5b4fc;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      padding: 0 6px;
      margin-top: 2px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 4px;
      
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      max-width: 100%;
    }

    .rtl { direction: rtl; unicode-bidi: embed; }

    /* Punto de conexión (solo visible con ?debug=1) */
    .conn-dot { display: none; }
    .conn-dot.debug-visible { display: block; position: fixed; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; transition: background 400ms; z-index: 999; }
    .conn-dot.connected { background: #22c55e; }

    #watermark {
      position: fixed; bottom: 12px; right: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.5);
      pointer-events: none; z-index: 999;
      display: none;
      background: rgba(0,0,0,0.3);
      padding: 4px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="pos-bottom">

  <div class="conn-dot" id="connDot"></div>
  <div id="watermark">streamtranslate.live</div>

  <div class="subtitle-container" id="subtitleContainer">
    <div class="subtitle-original" id="subtitleOriginal"></div>
    <div class="subtitle-translated" id="subtitleTranslated"></div>
    <div class="subtitle-translated" id="subtitleTranslated2" style="display:none;"></div>
  </div>

  <script>
    // ================================================================
    // 📌 TUS PARÁMETROS REALES (YA PUESTOS)
    // ================================================================
    const roomId = 'd5306a7b-mtm3b6qu';
    const overlayTok = '86c3dc27aa89ac202d0a6db6de881d34363f7f641c34eb8a348831083174c163';
    const position = 'bottom';
    let fontSize = 54;           // Tamaño base para la traducción principal
    const origColor = 'ffffff';
    const transColor = '00ffcc';

    console.log('🔑 Conectando a sala:', roomId);
    console.log('🔐 Token:', overlayTok);

    // Aplicar posición
    document.body.className = `pos-${position}`;

    // Referencias a elementos
    const origEl   = document.getElementById('subtitleOriginal');
    const transEl  = document.getElementById('subtitleTranslated');
    const trans2El = document.getElementById('subtitleTranslated2');

    // Configuración inicial de estilos
    origEl.style.fontSize   = Math.round(fontSize * 0.6) + 'px';
    transEl.style.fontSize  = fontSize + 'px';
    trans2El.style.fontSize = Math.round(fontSize * 0.7) + 'px';
    origEl.style.color      = '#' + origColor;
    transEl.style.color     = '#' + transColor;
    trans2El.style.color    = '#a5b4fc';

    // ================================================================
    // 🌐 CONEXIÓN AL SERVIDOR (FORZANDO WEBSOCKET PARA EVITAR CORS)
    // ================================================================
    // ⚡  CLAVE: forzamos transporte 'websocket' y usamos la ruta por defecto
    const socket = io('https://streamtranslate.live', {
      transports: ['websocket'],   // 👈 ESTO ES LO QUE CORRIGE EL CORS
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
    });

    const connDot = document.getElementById('connDot');
    if (new URLSearchParams(window.location.search).get('debug') === '1') {
      connDot.classList.add('debug-visible');
    }

    socket.on('connect', () => {
      console.log('✅ Conectado al servidor de StreamTranslate vía WebSocket');
      connDot.classList.add('connected');
      socket.emit('join-room', roomId, { overlay: true, tok: overlayTok, preview: false });
      console.log(`📡 Unido a sala: ${roomId}`);
    });

    socket.on('connect_error', (err) => {
      console.error('❌ Error de conexión:', err.message);
    });

    socket.on('disconnect', () => {
      connDot.classList.remove('connected');
      document.getElementById('subtitleContainer').classList.remove('visible');
    });

    // ================================================================
    // 📩 RECEPCIÓN DE SUBTÍTULOS CON AJUSTE INTELIGENTE DE TAMAÑO
    // ================================================================
    const container = document.getElementById('subtitleContainer');
    let clearTimer = null;
    let _lastTranslation = null;
    let _lastTranslation2 = null;

    const RTL_LANGS = ['ar', 'he', 'fa', 'ur'];
    const CJK_FONT = "'Noto Sans SC','Noto Sans JP','Noto Sans KR','PingFang SC','Microsoft YaHei','Hiragino Sans',sans-serif";
    const CJK_LANGS = ['zh', 'ja', 'ko'];
    const AR_FONT = "'Noto Sans Arabic','Arial',sans-serif";

    function applyLangFont(el, lang) {
      if (CJK_LANGS.includes(lang)) el.style.fontFamily = CJK_FONT;
      else if (lang === 'ar') el.style.fontFamily = AR_FONT;
    }

    // 🔧  FUNCIÓN QUE AJUSTA EL TAMAÑO DE FUENTE SEGÚN LA LONGITUD DEL TEXTO
    function adjustFontSize(text, element, baseSize) {
      const len = text ? text.length : 0;
      let newSize = baseSize;
      
      if (len > 120) newSize = baseSize * 0.55;
      else if (len > 80) newSize = baseSize * 0.70;
      else if (len > 50) newSize = baseSize * 0.85;
      else newSize = baseSize;
      
      // Aseguramos un mínimo para que no sea ilegible
      newSize = Math.max(newSize, 22);
      element.style.fontSize = newSize + 'px';
      
      // También ajustamos el original proporcionalmente
      origEl.style.fontSize = Math.round(newSize * 0.6) + 'px';
      
      return newSize;
    }

    function showSubtitle(data, interim = false) {
      console.log('📝 Subtítulo:', data.original, '->', data.translated);

      // --- Texto original ---
      origEl.textContent = data.original + (interim ? '...' : '');
      origEl.style.color = '#' + origColor;

      // --- Texto traducido (principal) ---
      let transText;
      if (data.translated) {
        transText = data.translated;
        _lastTranslation = data.translated;
      } else if (_lastTranslation !== null) {
        transText = _lastTranslation;
      } else {
        transText = '';
      }
      transEl.textContent = transText + (interim ? '...' : '');
      transEl.style.color = '#' + transColor;
      transEl.classList.toggle('rtl', RTL_LANGS.includes(data.lang));
      applyLangFont(transEl, data.lang);
      transEl.style.opacity = interim ? '0.75' : '1';

      // 🔥  AJUSTE DINÁMICO DEL TAMAÑO SEGÚN LA LONGITUD
      adjustFontSize(transText, transEl, fontSize);

      // --- Segunda traducción (si existe) ---
      let trans2Text;
      if (data.translated2) {
        trans2Text = data.translated2;
        _lastTranslation2 = data.translated2;
      } else if (_lastTranslation2 !== null) {
        trans2Text = _lastTranslation2;
      } else {
        trans2Text = '';
      }
      if (trans2Text) {
        trans2El.style.display = '';
        trans2El.textContent = trans2Text + (interim ? '...' : '');
        trans2El.classList.toggle('rtl', RTL_LANGS.includes(data.lang2));
        trans2El.style.opacity = interim ? '0.75' : '1';
        trans2El.style.color = '#a5b4fc';
        // Ajuste de tamaño para la segunda línea (siempre un poco más pequeña)
        const base2 = fontSize * 0.7;
        adjustFontSize(trans2Text, trans2El, base2);
      } else {
        trans2El.style.display = 'none';
      }

      // Mostrar contenedor
      container.classList.add('visible');
      clearTimeout(clearTimer);
      if (!interim) {
        clearTimer = setTimeout(() => container.classList.remove('visible'), 4000);
      }
    }

    socket.on('subtitle', (data) => {
      if (data && data.mismatched) return;
      showSubtitle(data, false);
    });
    socket.on('subtitle-interim', (data) => {
      if (data && data.mismatched) return;
      showSubtitle(data, true);
    });

    // GESTIÓN DE LÍMITES (trial, horas)
    let overlayDisabled = false;
    socket.on('trial-expired', () => {
      console.warn('⛔ Prueba expirada');
      overlayDisabled = true;
      container.classList.remove('visible');
    });
    socket.on('hour-cap-reached', () => {
      console.warn('⏳ Límite de horas alcanzado');
      overlayDisabled = true;
      container.classList.remove('visible');
    });

    // Mantener conexión viva
    setInterval(() => {
      if (socket.connected) socket.emit('overlay-ping');
    }, 45000);

    console.log('🚀 Overlay listo. Esperando voz...');
  </script>
</body>
</html>
