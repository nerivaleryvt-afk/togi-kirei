<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtítulos - Togi Kirei</title>

  <!-- Cargamos socket.io desde el servidor de ellos (evita CORS) -->
  <script src="https://streamtranslate.live/socket.io/socket.io.js">
  </script>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       🎯  AJUSTE ESTRICTO A 652px ANCHO Y 169px ALTO
       ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    body.pos-top {
      align-items: flex-start;
      padding-top: 0;
    }
    body.pos-middle {
      align-items: center;
    }
    body.pos-bottom {
      align-items: flex-end;
      padding-bottom: 0;
    }

    .subtitle-container {
      width: 652px;
      height: 169px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      overflow: hidden;
    }
    .subtitle-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ============================================================
       🚫  OCULTAR EL TEXTO ORIGINAL (español) DE FORMA ABSOLUTA
       ============================================================ */
    #subtitleOriginal {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
      position: absolute !important;
      pointer-events: none !important;
    }

    /* ============================================================
       📝  SOLO TEXTO TRADUCIDO
       ============================================================ */
    .subtitle-translated {
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.95), 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      padding: 0 4px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      max-width: 100%;
    }
    #subtitleTranslated2 {
      font-weight: 500;
      line-height: 1.2;
      color: #a5b4fc;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
      padding: 0 4px;
      margin-top: 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 2px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      max-width: 100%;
    }
    .rtl {
      direction: rtl;
      unicode-bidi: embed;
    }

    /* Punto de conexión (solo visible con ?debug=1) */
    .conn-dot {
      display: none;
    }
    .conn-dot.debug-visible {
      display: block;
      position: fixed;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 400ms;
      z-index: 999;
    }
    .conn-dot.connected {
      background: #22c55e;
    }

    #watermark {
      position: fixed;
      bottom: 4px;
      right: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      z-index: 999;
      display: none;
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="pos-bottom">

  <div class="conn-dot" id="connDot"></div>
  <div id="watermark">streamtranslate.live</div>

  <div class="subtitle-container" id="subtitleContainer">
    <div class="subtitle-original" id="subtitleOriginal"></div>
    <div class="subtitle-translated" id="subtitleTranslated"></div>
    <div class="subtitle-translated" id="subtitleTranslated2" style="display:none;"></div>
  </div>

  <script>
    // ================================================================
    // 📌  LECTURA DE PARÁMETROS DESDE LA URL
    // ================================================================
    const params = new URLSearchParams(window.location.search);

    // ✅ PARÁMETROS ACTUALIZADOS CON LA SALA Y TOKEN PROPORCIONADOS
    const roomId = params.get('room') || '0c927734-mtnknm9o';
    const overlayTok = params.get('tok') || 'edd14bbecc07c5cd822522ac22db0074ac8ffdb1cc73168e3367da0f464dd29a';

    // Parámetros opcionales con valores por defecto
    const position = params.get('position') || 'bottom';
    const fontSize = parseInt(params.get('fontSize')) || 36; // Tamaño base (36 como en la URL)
    const transColor = params.get('transColor') || '00ffcc';
    const trans2Color = params.get('trans2Color') || 'a5b4fc';
    const displayTime = parseInt(params.get('displayTime')) || 5000; // 5 segundos por defecto
    const showOriginal = params.get('showOriginal') === '1'; // Por defecto oculto

    console.log('🔑 Conectando a sala:', roomId);
    console.log('🔐 Token:', overlayTok);
    console.log(`⏱️  Tiempo de permanencia: ${displayTime/1000} segundos`);
    console.log(`👁️  Mostrar original: ${showOriginal ? 'SÍ' : 'NO'}`);
    console.log(`📐 Tamaño de fuente base: ${fontSize}px`);

    // ================================================================
    // 📐  MEDIDAS FIJAS
    // ================================================================
    const CONTAINER_WIDTH = 652;
    const CONTAINER_HEIGHT = 169;
    const AVAILABLE_WIDTH = CONTAINER_WIDTH - 24;
    const LINE_HEIGHT = 1.2;

    // ================================================================
    // 🔧  AJUSTE DE TAMAÑO DE FUENTE
    // ================================================================
    function adjustFontSize(text, element) {
      if (!text || text.length === 0) return;
      const CHAR_WIDTH_FACTOR = 0.55;
      let baseSize = fontSize;
      let newSize = baseSize;
      let lines = 1;
      let neededHeight = 0;
      for (let size = baseSize; size > 14; size -= 1) {
        const charsPerLine = AVAILABLE_WIDTH / (size * CHAR_WIDTH_FACTOR);
        lines = Math.ceil(text.length / charsPerLine);
        neededHeight = lines * size * LINE_HEIGHT;
        if (neededHeight <= CONTAINER_HEIGHT) {
          newSize = size;
          break;
        }
      }
      if (neededHeight > CONTAINER_HEIGHT) {
        newSize = Math.max(16, newSize * (CONTAINER_HEIGHT / neededHeight));
      }
      newSize = Math.max(16, newSize);
      element.style.fontSize = newSize + 'px';
      return newSize;
    }

    // ================================================================
    // 🌐  CONEXIÓN AL SERVIDOR (SOLO WEBSOCKET)
    // ================================================================
    const socket = io('https://streamtranslate.live', {
      transports: ['websocket'],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
    });

    document.body.className = `pos-${position}`;

    const origEl = document.getElementById('subtitleOriginal');
    const transEl = document.getElementById('subtitleTranslated');
    const trans2El = document.getElementById('subtitleTranslated2');
    const container = document.getElementById('subtitleContainer');
    const connDot = document.getElementById('connDot');

    if (params.get('debug') === '1') {
      connDot.classList.add('debug-visible');
    }

    // 🔥  OCULTAR ORIGINAL (a menos que showOriginal=1)
    if (!showOriginal) {
      origEl.style.display = 'none';
      origEl.style.visibility = 'hidden';
      origEl.style.opacity = '0';
      origEl.style.width = '0';
      origEl.style.height = '0';
      origEl.style.position = 'absolute';
      origEl.style.pointerEvents = 'none';
    }

    transEl.style.color = '#' + transColor;
    trans2El.style.color = '#' + trans2Color;

    socket.on('connect', () => {
      console.log('✅ Conectado vía WebSocket');
      connDot.classList.add('connected');
      socket.emit('join-room', roomId, {
        overlay: true,
        tok: overlayTok,
        preview: false
      });
      console.log(`📡 Unido a sala: ${roomId}`);
    });

    socket.on('connect_error', (err) => {
      console.error('❌ Error de conexión:', err.message);
    });

    socket.on('disconnect', () => {
      connDot.classList.remove('connected');
      container.classList.remove('visible');
    });

    // ================================================================
    // 📩  SUBTÍTULOS
    // ================================================================
    let clearTimer = null;
    let _lastTranslation = null;
    let _lastTranslation2 = null;

    const RTL_LANGS = ['ar', 'he', 'fa', 'ur'];
    const CJK_FONT = "'Noto Sans SC','Noto Sans JP','Noto Sans KR','PingFang SC','Microsoft YaHei','Hiragino Sans',sans-serif";
    const CJK_LANGS = ['zh', 'ja', 'ko'];
    const AR_FONT = "'Noto Sans Arabic','Arial',sans-serif";

    function applyLangFont(el, lang) {
      if (CJK_LANGS.includes(lang)) el.style.fontFamily = CJK_FONT;
      else if (lang === 'ar') el.style.fontFamily = AR_FONT;
      else el.style.fontFamily = "'Inter',system-ui,sans-serif";
    }

    function showSubtitle(data, interim = false) {
      console.log('📝 Traducción:', data.translated);

      // --- Original (solo si showOriginal está activo) ---
      if (showOriginal) {
        origEl.textContent = data.original + (interim ? '...' : '');
      }

      // --- Traducción principal ---
      let transText;
      if (data.translated) {
        transText = data.translated;
        _lastTranslation = data.translated;
      } else if (_lastTranslation !== null) {
        transText = _lastTranslation;
      } else {
        transText = '';
      }
      transEl.textContent = transText + (interim ? '...' : '');
      transEl.style.color = '#' + transColor;
      transEl.classList.toggle('rtl', RTL_LANGS.includes(data.lang));
      applyLangFont(transEl, data.lang);
      transEl.style.opacity = interim ? '0.75' : '1';

      adjustFontSize(transText, transEl);

      // --- Segunda traducción ---
      let trans2Text;
      if (data.translated2) {
        trans2Text = data.translated2;
        _lastTranslation2 = data.translated2;
      } else if (_lastTranslation2 !== null) {
        trans2Text = _lastTranslation2;
      } else {
        trans2Text = '';
      }
      if (trans2Text) {
        trans2El.style.display = '';
        trans2El.textContent = trans2Text + (interim ? '...' : '');
        trans2El.classList.toggle('rtl', RTL_LANGS.includes(data.lang2));
        trans2El.style.opacity = interim ? '0.75' : '1';
        trans2El.style.color = '#' + trans2Color;
        applyLangFont(trans2El, data.lang2);
        const base2 = Math.round(parseFloat(transEl.style.fontSize) * 0.7);
        trans2El.style.fontSize = Math.max(14, base2) + 'px';
      } else {
        trans2El.style.display = 'none';
      }

      container.classList.add('visible');
      clearTimeout(clearTimer);
      if (!interim) {
        clearTimer = setTimeout(() => container.classList.remove('visible'), displayTime);
      }
    }

    socket.on('subtitle', (data) => {
      if (data && data.mismatched) return;
      showSubtitle(data, false);
    });
    socket.on('subtitle-interim', (data) => {
      if (data && data.mismatched) return;
      showSubtitle(data, true);
    });

    // Gestión de límites
    let overlayDisabled = false;
    socket.on('trial-expired', () => {
      console.warn('⛔ Prueba expirada');
      overlayDisabled = true;
      container.classList.remove('visible');
    });
    socket.on('hour-cap-reached', () => {
      console.warn('⏳ Límite de horas alcanzado');
      overlayDisabled = true;
      container.classList.remove('visible');
    });

    // Mantener conexión viva
    setInterval(() => {
      if (socket.connected) socket.emit('overlay-ping');
    }, 45000);

    console.log('🚀 Overlay listo. Solo traducción visible. Sala:', roomId);
  </script>
</body>
</html>
